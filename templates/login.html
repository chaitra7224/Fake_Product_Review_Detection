<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Fake Review Detection</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    <!-- Navigation -->

    <nav class="site-navbar">

        <div class="site-logo">
            Fake Review Detection
        </div>


        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

        </div>

    </nav>



    <!-- Login -->

    <main class="login-container">


        <div class="login-card">


            <div class="login-logo">
                Fake Review Detection
            </div>


            <p class="login-subtitle">
                Login to access the fake review detection system.
            </p>



            <!-- Error -->

            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}



            <!-- Login Form -->

            <form
                method="POST"
                action="{{ url_for('login') }}"
            >


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- ONLY ONE LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Login
                </button>


            </form>


            <p class="login-note">
                Enter your credentials to continue to the system.
            </p>


        </div>


    </main>



    <!-- Footer -->

    <footer class="site-footer">

        Fake Product Review Detection Using Machine Learning

    </footer>


</body>

</html>
